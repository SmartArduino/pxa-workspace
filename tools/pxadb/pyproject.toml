[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxadb"
version = "0.1.0"
description = "PXADB development client for PXA devices"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
pxadb = "pxadb:main"

[tool.setuptools]
py-modules = ["pxadb"]
