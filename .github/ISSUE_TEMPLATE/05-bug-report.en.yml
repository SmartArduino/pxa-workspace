name: English | Bug report
description: Report a bug, crash or unexpected behavior.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |-
        This repository covers: ESP firmware, board drivers, flashing, workspace scripts and display profiles.

        - [pxa-system](https://github.com/SmartArduino/pxa-system/issues/new?template=05-bug-report.en.yml): System runtime, services, UI, SDK, DevKit, Agent Kit, packaging tools and simulator implementation.
        - [pxa-apps](https://github.com/SmartArduino/pxa-apps/issues/new?template=05-bug-report.en.yml): PXA apps, games, store client and shared application code.

        If unsure, report what you observed and link related issues. Please avoid duplicate reports.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/SmartArduino/pxa-workspace/issues?q=is%3Aissue)
            and found no duplicate.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Firmware build and flashing
        - Board drivers and peripherals
        - Workspace scripts and PXADB
        - Display and input profiles
        - Factory provisioning and delivery
        - Unsure or other
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Versions
      description: Include the firmware version or download URL, and workspace/system commits for source builds;
        use unknown if unavailable.
      placeholder: |-
        Firmware version / download URL:
        pxa-workspace commit (git rev-parse HEAD):
        pxa-system commit (git -C deps/pxa-system rev-parse HEAD):
        ESP-IDF version (source builds only):
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include board/revision or simulator profile, plus host OS/tool versions for build, flash or tool
        issues; use N/A where appropriate.
      placeholder: |-
        Device or simulator:
        Board / hardware revision / chip:
        Flash / PSRAM / storage (if relevant):
        Display size / profile / input (if relevant):
        Host OS / architecture / tool versions (if relevant):
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Actual behavior
      description: Describe the error and its impact; report one problem per issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands, configuration or a minimal example; describe triggers and frequency for
        intermittent issues.
      placeholder: |-
        1. Prepare the board, firmware and configuration
        2. Run the exact command or action
        3. Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen with the same steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs with surrounding context, without code fences; remove private keys, tokens
        and personal data.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Attachments and context
      description: Attach screenshots, recordings or a minimal reproducer; include known working versions, workarounds
        and related issues if available.
    validations:
      required: false
