message Rpc_Req_AlarmSet{
    uint32 year = 1;
    uint32 month = 2;
    uint32 day = 3;
    uint32 hour = 4;
    uint32 minute = 5;
    uint32 second = 6;
    uint32 index = 7;
    // mode 位掩码（与 SDK alarm 一致）：
    //   0x00 = ONCE
    //   0x01 = EVERY_DAY
    //   0x02..0x80 = 周一..周日（可按位或组合）
    uint32 mode = 8;
    // 闹钟开关：0 = 未指定（兼容旧主机，按启用处理），1 = 启用，2 = 关闭（保留槽位仅停用）
    uint32 sw = 9;
}

message Rpc_Resp_AlarmSet{
    int32 resp = 1;
    uint32 index = 2;
}

message Rpc_Req_AlarmCancel{
    uint32 index = 1;
    bool all = 2;
}

message Rpc_Resp_AlarmCancel{
    int32 resp = 1;
    uint32 index = 2;
    bool all = 3;
}

message Rpc_Req_AlarmGet{
    uint32 index = 1;
}

message Rpc_Resp_AlarmGet{
    int32 resp = 1;
    bool active = 2;
    uint32 year = 3;
    uint32 month = 4;
    uint32 day = 5;
    uint32 hour = 6;
    uint32 minute = 7;
    uint32 second = 8;
    uint32 index = 9;
    uint32 mode = 10;       // 与 Rpc_Req_AlarmSet.mode 同义
}

message Rpc_Req_BtDisconnect{
    // true  = 只断开当前连接, 保留配对信息(link key / 设备记录), 下次可直接回连
    // false = 断开并解绑(删 link key + 删设备记录), 与本字段出现之前的行为一致
    //
    // 特意取 keep_bond 而不是 unbind: proto3 不发默认值, 旧固件收到新主机的包时
    // 本字段一律缺省, 按 false 走解绑 —— 和它本来的行为撞在同一个语义上。反过来
    // 定义成 unbind 的话, 旧固件会把"只断开"当成解绑执行, 而且不报错。
    bool keep_bond = 1;
}

message Rpc_Resp_BtDisconnect{
    int32 resp = 1;
}

