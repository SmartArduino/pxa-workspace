// 请求: 查询SD卡音乐数量
message Rpc_Req_SdMusicCount{
    StorageDevType dev = 1; // 设备类型 (SD0/SD1/USB)
}

// 响应: 查询SD卡音乐数量
message Rpc_Resp_SdMusicCount{
    int32 resp = 1;         // 错误码 (0=成功)
    uint32 total = 2;       // 音乐文件总数
}

// 请求: 获取SD卡音乐列表
message Rpc_Req_SdMusicList{
    StorageDevType dev = 1; // 设备类型 (SD0/SD1/USB)
    uint32 offset = 2;      // 起始索引 (0-based)
    uint32 count = 3;       // 请求的数量
}

// 响应: 获取SD卡音乐列表
message Rpc_Resp_SdMusicList{
    int32 resp = 1;             // 错误码 (0=成功)
    uint32 offset = 2;          // 本次返回的起始索引
    uint32 count = 3;           // 本次返回的数量
    uint32 total = 4;           // 音乐文件总数
    repeated SdMusicFileInfo files = 5; // 文件列表
}

