// 请求: 获取固件版本号
message Rpc_Req_FirmwareVersionGet{
}

// 响应: 获取固件版本号
message Rpc_Resp_FirmwareVersionGet{
    int32 resp = 1;         // 错误码 (0=成功)
    bytes name = 2;         // 固件名称 (UTF-8)
    bytes version = 3;      // 固件版本号 (UTF-8)
    bytes build_date = 4;   // 编译日期
    bytes build_time = 5;   // 编译时间
    // 本机蓝牙 MAC, 6 字节, 原始顺序(与 bt_get_mac_addr 一致, 不做倒序) ——
    // fst 加密语法包就是按这个顺序封装的, 直接喂给 fst_export.py --device-mac。
    // 空(len==0) = 固件不支持本字段, 或调用时蓝牙还没起来。
    bytes mac = 6;
}



// ---- ASR 词表语法容器 ----
//
// 语法决定"能识别哪些词", 声学模型编在固件里不动, 换词表不必刷固件。
// 语法按 (区域, 组号) 两级寻址, 每个区域里可以放多份:
//
//   BUILTIN  编译期内嵌, 只读, 掉电保留 —— 永远可用的兜底
//   SRAM     临时写入, 掉电即失 —— 用来试效果, 不满意重启就没了
//   FLASH    保留区分区, 掉电保留, OTA 不擦除 —— 确认好用了才写这里
//
// 典型流程: 写 SRAM 试听 -> 满意 -> 写 FLASH 持久化 -> Select 切过去。
// 出问题随时 Select(BUILTIN, 0) 退回去。
//
// 容器格式是 FASR FST v2, 必须带关键词分类表(导出时给 --cmd) —— 没有分类表
// 就分不出唤醒词, 固件在扫描阶段直接拒收, 不会出现"装上了但唤不醒"。
enum AsrFstArea {
    ASR_FST_AREA_BUILTIN = 0;
    ASR_FST_AREA_SRAM    = 1;
    ASR_FST_AREA_FLASH   = 2;
}

// 一组语法的概览。所有字段在设备扫描时就算好了, 查询不额外开销。
message AsrFstGroup {
    AsrFstArea area   = 1;
    uint32 index      = 2;
    bytes  id         = 3;      // 容器里的唯一标识, 没设时为空
    uint32 num_words  = 4;      // 真词数(唤醒 + 命令, 已排除图内部的伪词)
    uint32 num_states = 5;
    uint32 wake_count = 6;
    uint32 cmd_count  = 7;
    uint32 bytes_size = 8;      // 该容器占多少字节
}

// ---- 设备能力与当前状态 ----
message Rpc_Req_AsrFstInfo {}
message Rpc_Resp_AsrFstInfo {
    int32  resp = 1;
    bool   engine_present = 2;    // 固件编进了 fst 引擎, 否则整组接口不可用
    bool   flash_supported = 3;   // 有没有 flash 语法分区
    uint32 flash_capacity = 4;    // flash 分区大小
    uint32 flash_used     = 5;
    uint32 flash_count    = 6;    // flash 分区里的组数
    uint32 builtin_count  = 7;    // 编译内置的组数
    uint32 sram_count     = 8;    // SRAM 里的组数
    uint32 sram_capacity  = 9;
    uint32 group_max      = 10;   // 单区域最多认几组
    AsrFstArea active_area = 11;  // 当前生效的是哪一组
    uint32 active_index   = 12;
    bytes  active_id      = 13;
    uint32 max_states     = 14;   // 解码器状态数上限, 主机构图时自检用
    uint32 max_chunk      = 15;   // 写入分片的 payload 上限
    uint32 container_version = 16;
}

// 列出各组。all_areas=true 时忽略 area, 把三个区域按 BUILTIN/SRAM/FLASH
// 的顺序连起来返回。
message Rpc_Req_AsrFstList {
    AsrFstArea area = 1;
    bool   all_areas = 2;
    uint32 start = 3;
    uint32 count = 4;           // 0 表示由固件按帧长决定
}
message Rpc_Resp_AsrFstList {
    int32  resp = 1;
    uint32 detail = 2;          // fst_err_t 原始码, 便于定位
    uint32 total = 3;
    uint32 start = 4;
    repeated AsrFstGroup groups = 5;
}

// 取指定一组的词表 —— 不必先切过去就能看某组里都有什么词。
// 词按"唤醒词在前、命令词在后"排, 前 wake_count 个必定是唤醒词。
// 词多时一帧发不下: 固件按帧长自行截断, 不保证给满 count 个,
// 以 total 为准判断有没有拉完。
message Rpc_Req_AsrFstWords {
    AsrFstArea area = 1;
    uint32 index = 2;
    uint32 start = 3;
    uint32 count = 4;
}
message Rpc_Resp_AsrFstWords {
    int32  resp = 1;
    uint32 detail = 2;
    bytes  id = 3;              // 该组的唯一标识
    uint32 total = 4;           // 该组的真词总数
    uint32 start = 5;           // 本页起始序号(回显, 便于对账)
    repeated wake_word_info words_list = 6;
}

// 切换当前生效的语法
message Rpc_Req_AsrFstSelect {
    AsrFstArea area = 1;
    uint32 index = 2;
    bool   persist = 3;         // 记住这次选择, 下次开机自动用它
}
message Rpc_Resp_AsrFstSelect {
    int32  resp = 1;
    uint32 detail = 2;
    AsrFstArea active_area = 3;
    uint32 active_index = 4;
    bytes  active_id = 5;
}

// 清空一个区域: SRAM 释放内存, FLASH 擦掉分区, BUILTIN 会被拒。
// 正在使用的区域不能擦, 先 Select 到别处。
message Rpc_Req_AsrFstErase {
    AsrFstArea area = 1;
}
message Rpc_Resp_AsrFstErase {
    int32  resp = 1;
    uint32 detail = 2;
}

// ---- 写入会话 ----
//
// 下发的一律是**设备绑定加密包**: 服务器按目标设备的蓝牙 MAC 封装, 换台机器
// 解不开。每份容器的形态是 [header 明文][body 密文][key_id 1][保留 3][salt 16][tag 16], header
// 不加密, 所以固件收到第一片就能读出 total_size / num_states 提前拒。
//
// 一次会话可以连续写多份 —— 主机把 N 份加密包首尾相接发过来(不用自己算对齐,
// 每份的长度就是它 header 里的 total_size + 36)。固件全程收在 RAM 里,
// WriteEnd 时整批解封、把明文挤成连续镜像, 校验都过了才落到目标区域。
// 同一时刻只允许一个会话。
//
// 因此 WriteBegin 不再擦除 FLASH: 解封失败、中止、断线, 目标区域一个字节都
// 没被碰过, 老词表照常能用。
message Rpc_Req_AsrFstWriteBegin {
    AsrFstArea area = 1;        // 写到哪个区域(BUILTIN 会被拒)
    uint32 total_size = 2;      // N 份加密包拼起来的总字节数(含每份 36 字节尾巴)
    uint32 group_count = 3;     // 本次写入几份容器
    uint32 declared_max_states = 4;  // 主机声明的最大状态数, 用于提前拒绝
}
message Rpc_Resp_AsrFstWriteBegin {
    int32  resp = 1;
    uint32 detail = 2;
    uint32 capacity = 3;        // 该区域容量, 便于主机提前判断放不放得下
    uint32 max_chunk = 4;       // 单片 payload 上限
    uint32 max_states = 5;      // 解码器的状态数上限
}

// 顺序追加。offset 必须等于已落盘字节数, 不匹配直接拒绝(不做乱序重组)。
message Rpc_Req_AsrFstWriteChunk {
    uint32 offset = 1;
    bytes  payload = 2;
}
message Rpc_Resp_AsrFstWriteChunk {
    int32  resp = 1;
    uint32 detail = 2;
    uint32 written = 3;         // 已落盘字节数; 断线后据此续传
}

// 收尾: 整批解封(AES-128-CTR 解密 + AES-CMAC 校验), 再扫描该区域逐个容器做
// 完整校验(含 CRC32) —— 两层互相独立, CMAC 管"是不是发给这台机器的、有没有被
// 改过", CRC32 管"解出来的数据对不对"。
// 认下的组数与 group_count 对不上就算失败。
// 解封失败(密钥不对/错设备/被篡改/发的是明文包)时 resp = RPC_ERR(-1),
// detail = FST_ERR_DECRYPT(14); 和数据传坏了(RPC_ERR_INVALID_ARG)分得开 ——
// 前者要换包, 后者重传就行。
message Rpc_Req_AsrFstWriteEnd {
    bool   apply_now = 1;       // true 立即切到本次写入的语法
    uint32 apply_index = 2;     // apply_now 时切到哪一组
}
message Rpc_Resp_AsrFstWriteEnd {
    int32  resp = 1;
    uint32 detail = 2;
    uint32 accepted = 3;              // 实际认下几组
    repeated AsrFstGroup groups = 4;  // 每组的 id/词数/状态数, 便于主机对账
}

// 放弃当前会话, 释放 RAM。目标区域没被碰过, 老词表照常可用。
message Rpc_Req_AsrFstWriteAbort {}
message Rpc_Resp_AsrFstWriteAbort {
    int32  resp = 1;
    uint32 detail = 2;
}

