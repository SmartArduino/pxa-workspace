syntax = "proto3";

enum CodecFmt{
    CODEC_OPUS_20MS = 0;
    CODEC_OPUS_40MS = 1;
    CODEC_OPUS_60MS = 2;
    CODEC_PCM_8K   =  3;
    CODEC_PCM_16K   = 4;
}

enum WakeWordType {
    WORD_TYPE_WAKEUP   = 0;
    WORD_TYPE_COMMMAND = 1;
}

enum MusicMode{
    MODE_BT = 0;
    MODE_SD = 1;
    MODE_USB = 2;
    MODE_IN_FLASH = 3;
    MODE_MAX = 4;
}

enum MusicLoopMode {
    MUSIC_LOOP_MODE_ORDER = 0;
    MUSIC_LOOP_MODE_SINGLE = 1;
    MUSIC_LOOP_MODE_RANDOM = 2;
    MUSIC_LOOP_MODE_MAX = 3;
}

enum MusicPlayCtrl {
    MUSIC_PLAY_CTRL_PLAY = 0;
    MUSIC_PLAY_CTRL_PAUSE = 1;
    MUSIC_PLAY_CTRL_TOGGLE = 2;
    MUSIC_PLAY_CTRL_MAX = 3;
}

enum AsrMicMode {
    ASR_MIC_MODE_AEC = 0;
    ASR_MIC_MODE_ANS = 1;
}

enum StorageDevType {
    STORAGE_DEV_SD0 = 0;
    STORAGE_DEV_SD1 = 1;
    STORAGE_DEV_USB = 2;
}

enum StorageDevAction {
    STORAGE_DEV_ACTION_INSERT = 0;
    STORAGE_DEV_ACTION_REMOVE = 1;
}

enum BtWorkMode {
    BT_WORK_MODE_EMITTER = 0;
    BT_WORK_MODE_HFP = 1;
}

message wake_word_info{
    WakeWordType type = 1;
    bytes word_name = 2;
}

message Rpc_Req_VbInit{
    int32 keep_alive_ms     = 1;
    int32 pa_io             = 2;
    bool  pa_en_level       = 3;
    CodecFmt coder_fmt      = 4; 
    CodecFmt decoder_fmt    = 5; 
    bytes bt_name           = 6;
    int32 debug_uart_io = 7;
}

message Rpc_Resp_VbInit{
    int32 resp = 1;
}


// 取当前生效语法的词表。
// 返回当前运行期生效的词表 —— fst_asr 构建下是引擎正在用的那份语法,
// wanson 构建下是编译期的 asr_cmd_list。接口形态与老版本保持一致(无请求参数、
// 一次返回), 想按 (区域, 组号) 取别的组、或者需要分页, 用 Req_AsrFstWords。
message Rpc_Resp_GetAsrWords{
    int32 resp = 1;
    repeated wake_word_info words_list = 2;
}

