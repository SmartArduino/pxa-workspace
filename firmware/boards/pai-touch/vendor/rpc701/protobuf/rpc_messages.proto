message Rpc_Req_ButtonConfig{
    uint32 id = 1;                  // 按键 id, 0..255; 同时最多注册 32 个
    uint32 io = 2;                  // JL IO_PORT* 数值
    bool pressed_logic_level = 3;   // true=高电平按下, false=低电平按下
    uint32 short_press_ms = 4;      // 触发 SHORT_START/SHORT_UP 的时间
    uint32 long_press_ms = 5;       // 触发 LONG_START/LONG_UP 的时间
    uint32 long_hold_ms = 6;        // 触发 LONG_HOLD/LONG_HOLD_UP 的时间
    bool enable = 7;                // false 时注销该 id 的按键
}

// 响应: 配置 GPIO 按键
message Rpc_Resp_ButtonConfig{
    int32 resp = 1;
}

// 事件: GPIO 按键事件上报
message Rpc_Event_Button{
    int32 resp = 1;
    uint32 id = 2;
    ButtonEvent event = 3;
    uint32 click_cnt = 4;
    uint32 scan_cnt = 5;
}

