// A2DP 媒体状态（与 SDK BT_MUSIC_STATE 同义）
enum BtA2dpStatus {
    BT_A2DP_STATUS_IDLE = 0;
    BT_A2DP_STATUS_STARTING = 1;
    BT_A2DP_STATUS_SUSPENDING = 2;
}

// 当前蓝牙连接信息
message BtConnectionInfo{
    bool connected = 1;         // 是否已建立链路
    bytes addr = 2;             // 远端 BD_ADDR (6 字节, 倒序与 SDK 一致)
    bytes name = 3;             // 远端设备名 (UTF-8)
    uint32 dev_class = 4;       // CoD; 当前 SDK 无连接态查询接口, 未知时填 0
    bool is_sink = 5;           // 是否 A2DP Sink (耳机/音箱)
    bool support_hfp = 6;       // 远端是否支持 HFP (HF 或 AG)
    bool has_mic = 7;           // 远端是否含麦克风 (近似: support_hfp)
    bool support_cvsd = 8;      // 本机/链路支持 CVSD
    bool support_msbc = 9;      // 本机/链路支持 mSBC
    bool sco_connected = 10;    // 当前 SCO 通道是否建立
    BtA2dpStatus a2dp_status = 11; // A2DP 媒体状态
    bool a2dp_channel_up = 12;  // A2DP source channel 已就绪
    bool hfp_slc_up = 13;       // HFP SLC 已建立
}

// 请求: 获取当前蓝牙连接信息
message Rpc_Req_BtConnInfoGet{
}

// 响应: 获取当前蓝牙连接信息
message Rpc_Resp_BtConnInfoGet{
    int32 resp = 1;             // 错误码 (0=成功)
    BtConnectionInfo info = 2;
