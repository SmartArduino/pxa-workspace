enum OtaTransportId {
    OTA_TRANSPORT_RPC = 0;
    OTA_TRANSPORT_BLE = 1;
}

enum OtaTargetPolicy {
    OTA_POLICY_AUTO = 0;
    OTA_POLICY_RPC_PREFERRED = 1;
    OTA_POLICY_BLE_PREFERRED = 2;
    OTA_POLICY_DUAL_BANK_REQUIRED = 3;
}

enum OtaSessionState {
    OTA_SESSION_IDLE = 0;
    OTA_SESSION_OPENED = 1;
    OTA_SESSION_RECVING = 2;
    OTA_SESSION_VERIFY_PENDING = 3;
    OTA_SESSION_READY = 4;
    OTA_SESSION_FAILED = 5;
    OTA_SESSION_ABORTED = 6;
}

enum OtaReasonCode {
    OTA_REASON_NONE = 0;
    OTA_REASON_SESSION_BUSY = 1;
    OTA_REASON_BAD_STATE = 2;
    OTA_REASON_BAD_SESSION = 3;
    OTA_REASON_BAD_OFFSET = 4;
    OTA_REASON_BAD_SEQUENCE = 5;
    OTA_REASON_CHUNK_TOO_LARGE = 6;
    OTA_REASON_CRC_MISMATCH = 7;
    OTA_REASON_SIZE_MISMATCH = 8;
    OTA_REASON_CAPACITY_NOT_ENOUGH = 9;
    OTA_REASON_UNSUPPORTED_MODE = 10;
    OTA_REASON_INTERNAL = 11;
}

message Rpc_Req_OtaBegin{
    uint32 session_id = 1;
    uint32 image_size = 2;
    uint32 image_crc32 = 3;
    uint32 chunk_size = 4;
    uint32 protocol_version = 5;
    OtaTargetPolicy target_policy = 6;
    OtaTransportId transport_hint = 7;
    bytes resume_token = 8;
}

message Rpc_Resp_OtaBegin{
    int32 resp = 1;
    OtaSessionState state = 2;
    OtaReasonCode reason_code = 3;
    uint32 accepted_chunk_size = 4;
    uint32 next_offset = 5;
    OtaTransportId transport_id = 6;
    bool resume_supported = 7;
}

message Rpc_Req_OtaChunk{
    uint32 session_id = 1;
    uint32 seq = 2;
    uint32 offset = 3;
    bytes payload = 4;
    uint32 payload_crc32 = 5;
}

message Rpc_Resp_OtaChunk{
    int32 resp = 1;
    OtaSessionState state = 2;
    OtaReasonCode reason_code = 3;
    uint32 accepted_seq = 4;
    uint32 accepted_offset = 5;
    uint32 next_offset = 6;
}

message Rpc_Req_OtaCommit{
    uint32 session_id = 1;
    uint32 total_size = 2;
    uint32 total_chunks = 3;
    uint32 final_crc32 = 4;
}

message Rpc_Resp_OtaCommit{
    int32 resp = 1;
    OtaSessionState state = 2;
    OtaReasonCode reason_code = 3;
    uint32 received_size = 4;
}

message Rpc_Req_OtaAbort{
    uint32 session_id = 1;
    OtaReasonCode reason_code = 2;
}

message Rpc_Resp_OtaAbort{
    int32 resp = 1;
    OtaSessionState state = 2;
    OtaReasonCode reason_code = 3;
}

message Rpc_Req_OtaStatusQuery{
    uint32 session_id = 1;
}

message Rpc_Resp_OtaStatusQuery{
    int32 resp = 1;
    OtaSessionState state = 2;
    OtaReasonCode reason_code = 3;
    uint32 received_size = 4;
    uint32 next_offset = 5;
    uint32 next_seq = 6;
    uint32 chunk_size = 7;
    uint32 image_size = 8;
    uint32 image_crc32 = 9;
}

